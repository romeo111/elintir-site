<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ELINTIR - Redirecting</title>
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ffffff">
    <style>
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        background: #ffffff;
        color: #101010;
        font-family: Calibri, Carlito, Candara, "Segoe UI", ui-sans-serif, system-ui, sans-serif;
        font-size: 17px;
        letter-spacing: 0;
      }

      main {
        width: min(520px, calc(100% - 36px));
        padding: 28px;
        border: 1px solid #e2e2e2;
      }

      h1 {
        margin: 0 0 10px;
        font-size: 42px;
        letter-spacing: 0.06em;
      }

      p {
        color: #6e6e6e;
        line-height: 1.6;
      }

      a {
        color: #101010;
        font-weight: 700;
      }
    </style>
    <script>
      const base = location.hostname.endsWith("github.io") ? "/elintir-site/" : "/";
      location.replace(base);
    </script>
  </head>
  <body>
    <main>
      <h1>ELINTIR</h1>
      <p>This page moved to the landing page.</p>
      <a href="/">Open landing</a>
    </main>
  </body>
</html>
